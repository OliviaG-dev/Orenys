services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: orenys
      POSTGRES_PASSWORD: orenys
      POSTGRES_DB: orenys
    ports:
      - "5433:5432"
    volumes:
      - orenys_pg:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orenys -d orenys"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  orenys_pg:
